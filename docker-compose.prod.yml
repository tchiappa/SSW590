# PRODUCTION OVERRIDES FOR EC2 DEPLOYMENT
# Use: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  mysql:
    restart: unless-stopped

  backend:
    build:
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=ssw590
      - MYSQL_USER=express
      - MYSQL_PASSWORD=Express!23

  frontend:
    build:
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_BASE_URL=/api
    restart: unless-stopped
    ports:
      - "80:80"

  grafana:
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=

  prometheus:
    restart: unless-stopped

  cadvisor:
    restart: unless-stopped